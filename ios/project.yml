name: MarketingStudio
options:
  bundleIdPrefix: com.northstar
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: "-"
targets:
  MarketingStudio:
    type: application
    platform: iOS
    sources:
      - path: MarketingStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.northstar.marketingstudio
        PRODUCT_NAME: MarketingStudio
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: MarketingStudio/Info.plist
      properties:
        CFBundleDisplayName: Sokozia
        CFBundleDevelopmentRegion: fr
        CFBundleName: MarketingStudio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
    postBuildScripts:
      - name: Strip xattrs
        script: 'xattr -cr "$CODESIGNING_FOLDER_PATH" || true'
        basedOnDependencyAnalysis: false
schemes:
  MarketingStudio:
    build:
      targets:
        MarketingStudio: all
    run:
      config: Debug
    archive:
      config: Release
