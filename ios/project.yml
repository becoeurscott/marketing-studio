name: MarketingStudio
options:
  bundleIdPrefix: com.sokozia
  developmentLanguage: fr
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: LGHS3SPMJ7
    CODE_SIGN_IDENTITY: "-"
targets:
  MarketingStudio:
    type: application
    platform: iOS
    sources:
      - path: MarketingStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sokozia.app
        PRODUCT_NAME: MarketingStudio
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: MarketingStudio/MarketingStudio.entitlements
        STRING_CATALOG_GENERATE_SYMBOLS: "NO"
    info:
      path: MarketingStudio/Info.plist
      properties:
        CFBundleDisplayName: Marketing Studio
        CFBundleDevelopmentRegion: fr
        CFBundleName: MarketingStudio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.sokozia.app.auth
            CFBundleURLSchemes:
              - sokozia
        NSPhotoLibraryUsageDescription: Marketing Studio utilise vos photos et vidéos pour créer vos visuels et remplir vos modèles vidéo.
        NSPhotoLibraryAddUsageDescription: Marketing Studio enregistre vos vidéos montées dans Photos.
        UIAppFonts:
          - TikTokSans.ttf
          - Montserrat.ttf
          - PlayfairDisplay.ttf
          - BebasNeue-Regular.ttf
          - Anton-Regular.ttf
          - Poppins-Bold.ttf
          - Poppins-Black.ttf
          - PermanentMarker-Regular.ttf
        LSApplicationQueriesSchemes:
          - instagram
          - snssdk1233
          - tiktok
          - fb
          - whatsapp
    dependencies:
      - target: TemplateShare
        embed: true
    postBuildScripts:
      - name: Strip xattrs
        script: 'xattr -cr "$CODESIGNING_FOLDER_PATH" || true'
        basedOnDependencyAnalysis: false
  TemplateShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TemplateShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sokozia.app.TemplateShare
        PRODUCT_NAME: TemplateShare
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: TemplateShare/TemplateShare.entitlements
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: TemplateShare/Info.plist
      properties:
        CFBundleDisplayName: Marketing Studio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsMovieWithMaxCount: 1
schemes:
  MarketingStudio:
    build:
      targets:
        MarketingStudio: all
    run:
      config: Debug
    archive:
      config: Release
